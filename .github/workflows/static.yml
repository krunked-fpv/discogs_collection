name: Sync Discogs Collection & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Runs every 6 hours to keep your collection in sync automatically
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Sync Discogs collection (uses GitHub Secret DISCOGS_TOKEN)
        env:
          DISCOGS_USERNAME: "krunked"
          # Maps your encrypted GitHub Repository Secret into the exact same
          # DISCOGS_TOKEN environment variable used on your local Windows PC:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          if [ -n "$DISCOGS_TOKEN" ]; then
            python scripts/sync_discogs.py \
              --username "$DISCOGS_USERNAME" \
              --output data/collection.json \
              --inject-html index.html \
              --download-images \
              --analyze-pixels
          else
            echo "DISCOGS_TOKEN secret not configured; deploying static files as-is."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4